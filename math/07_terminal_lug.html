<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Measurement Lab - Terminal Lug</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#eef3f7;color:#17202a}
  .lab{max-width:760px;margin:0 auto;background:white;border:1px solid #c7d0d8}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 10px;background:#f8fafc;border-bottom:1px solid #d7dee5}
  .bar strong{margin-right:auto;font-size:14px}
  button{font:700 12px Arial;padding:7px 10px;border:1px solid #2f6f9f;border-radius:6px;background:white;cursor:pointer}
  button.active{background:#dceefb}
  .note{padding:7px 10px;background:#fff8dc;border-bottom:1px solid #e6dba9;font-size:12px}
  .stage{position:relative;height:360px;overflow:hidden;background:linear-gradient(#f8fbfd,#eef3f7);touch-action:pan-y}
  .part{position:absolute;left:0;top:0;width:100%;height:230px;pointer-events:none}
  .ruler{position:absolute;left:110px;top:285px;transform-origin:18px 22px;cursor:grab;touch-action:none;user-select:none}
  .ruler:active{cursor:grabbing}
  .hidden{display:none}
  .hint{position:absolute;left:50%;top:245px;transform:translateX(-50%);font-size:10px;color:#6b7680;border:1px solid #d4dbe1;border-radius:12px;padding:4px 9px;background:white}
  svg{display:block}
</style>
</head>
<body>
<div class="lab" id="lab">
  <div class="bar">
    <strong>Measurement Lab</strong>
    <button id="inchBtn" class="active" type="button">1/32 inch ruler</button>
    <button id="mmBtn" type="button">millimeter ruler</button>
    <button id="rotateBtn" type="button">Rotate 90°</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <div class="note">Drag the ruler around the object. Switch between the 1/32 inch ruler and the millimeter ruler. Rotate the ruler when measuring height. Record imperial measurements to the nearest 1/32 inch and metric measurements to the nearest millimeter.</div>
  <div class="stage" id="stage">
    <svg class="part" viewBox="0 0 760 230" aria-label="Measurement Lab - Terminal Lug">
      <g transform="translate(150 115) rotate(6)">
          <rect x="0" y="20.93" width="158.40" height="27.90" rx="7" fill="#c3924d" stroke="#6f512d" stroke-width="2"/>
          <circle cx="165.38" cy="34.88" r="34.88" fill="#c3924d" stroke="#6f512d" stroke-width="2"/>
          <circle cx="165.38" cy="34.88" r="13.95" fill="#eef1f4" stroke="#6f512d" stroke-width="2"/>
        </g>
    </svg>
    <div class="hint">Measure carefully!</div>

    <div class="ruler" id="inchRuler" aria-label="Draggable 1/32 inch ruler">
      <svg width="540" height="54" viewBox="0 0 540 54">
        <rect x="10" y="2" width="520" height="48" rx="2" fill="#fbfbf7" stroke="#2e3439"/>
        <line x1="18" y1="6" x2="18" y2="42" stroke="#111" stroke-width="1.5"/>
        <g id="inchTicks"></g>
      </svg>
    </div>

    <div class="ruler hidden" id="mmRuler" aria-label="Draggable millimeter ruler">
      <svg width="540" height="54" viewBox="0 0 540 54">
        <rect x="10" y="2" width="520" height="48" rx="2" fill="#fbfbf7" stroke="#2e3439"/>
        <line x1="18" y1="6" x2="18" y2="42" stroke="#111" stroke-width="1.5"/>
        <g id="mmTicks"></g>
      </svg>
    </div>
  </div>
</div>
<script>
(() => {
  const PPI = 72;
  const PPMM = PPI / 25.4;
  const stage = document.getElementById('stage');
  const inch = document.getElementById('inchRuler');
  const mm = document.getElementById('mmRuler');
  const inchBtn = document.getElementById('inchBtn');
  const mmBtn = document.getElementById('mmBtn');
  let active = inch, angle = 0;
  const start = {left:110, top:285};

  const inchG = document.getElementById('inchTicks');
  for (let i=0;i<=7*32;i++) {
    const x = 18 + i*(PPI/32);
    const mod = i % 32;
    let h = 9;
    if(mod===0) h=29;
    else if(mod===16) h=23;
    else if(mod%8===0) h=19;
    else if(mod%4===0) h=15;
    else if(mod%2===0) h=12;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x); line.setAttribute('x2',x);
    line.setAttribute('y1',6); line.setAttribute('y2',6+h);
    line.setAttribute('stroke','#111'); line.setAttribute('stroke-width',mod===0?'1.2':'0.7');
    inchG.appendChild(line);
    if(mod===0) {
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',x); t.setAttribute('y',45); t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','11'); t.setAttribute('font-family','Arial');
      t.textContent=i/32; inchG.appendChild(t);
    }
  }

  const mmG=document.getElementById('mmTicks');
  for(let i=0;i<=178;i++) {
    const x=18+i*PPMM;
    let h=9;
    if(i%10===0) h=28;
    else if(i%5===0) h=19;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x); line.setAttribute('x2',x);
    line.setAttribute('y1',6); line.setAttribute('y2',6+h);
    line.setAttribute('stroke','#111'); line.setAttribute('stroke-width',i%10===0?'1.2':'0.7');
    mmG.appendChild(line);
    if(i%10===0) {
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',x); t.setAttribute('y',45); t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','10'); t.setAttribute('font-family','Arial');
      t.textContent=i; mmG.appendChild(t);
    }
  }

  function applyTransform(el) {
    el.style.transform = `rotate(${angle}deg)`;
  }
  function show(which) {
    const pos={left:active.offsetLeft,top:active.offsetTop};
    active.classList.add('hidden');
    active=which; active.classList.remove('hidden');
    active.style.left=pos.left+'px'; active.style.top=pos.top+'px';
    applyTransform(active);
    inchBtn.classList.toggle('active', active===inch);
    mmBtn.classList.toggle('active', active===mm);
  }
  inchBtn.addEventListener('click',()=>show(inch));
  mmBtn.addEventListener('click',()=>show(mm));
  document.getElementById('rotateBtn').addEventListener('click',()=>{ angle=(angle+90)%360; applyTransform(active); });
  document.getElementById('resetBtn').addEventListener('click',()=>{
    angle=0;
    [inch,mm].forEach(r=>{r.style.left=start.left+'px';r.style.top=start.top+'px';r.style.transform='rotate(0deg)';});
  });

  let dragging=false, dx=0, dy=0;
  function down(e) {
    dragging=true;
    active.setPointerCapture(e.pointerId);
    dx=e.clientX-active.offsetLeft; dy=e.clientY-active.offsetTop;
    e.preventDefault();
  }
  function move(e) {
    if(!dragging) return;
    const rect=stage.getBoundingClientRect();
    let left=e.clientX-rect.left-dx+stage.scrollLeft;
    let top=e.clientY-rect.top-dy+stage.scrollTop;
    left=Math.max(-470,Math.min(stage.clientWidth-25,left));
    top=Math.max(-470,Math.min(stage.clientHeight-20,top));
    active.style.left=left+'px'; active.style.top=top+'px';
  }
  function up(e) {
    dragging=false;
    try{active.releasePointerCapture(e.pointerId)}catch(_e){}
  }
  [inch,mm].forEach(r=>{
    r.addEventListener('pointerdown',down);
    r.addEventListener('pointermove',move);
    r.addEventListener('pointerup',up);
    r.addEventListener('pointercancel',up);
  });
})();
</script>
</body>
</html>
