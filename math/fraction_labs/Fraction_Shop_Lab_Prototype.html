<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Shop Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:Arial,sans-serif;color:#24313a}.lab{max-width:980px;margin:16px auto;background:#fff;border:1px solid #bcc8d2;border-radius:10px;overflow:hidden}
header{background:#1f4e79;color:#fff;padding:17px 20px}header h1{margin:0 0 5px;font-size:25px}.controls{padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#f7f9fb;border-bottom:1px solid #d4dde5}
select,button{font:inherit;min-height:44px;padding:8px 11px}.current{font-size:20px;font-weight:800;color:#1f4e79}.main{padding:18px}.order{background:#eaf3fa;border-left:5px solid #1f4e79;padding:13px 15px;margin-bottom:15px}.order h2{margin:0 0 6px}
#work{min-height:390px;border:2px solid #b8c5cf;border-radius:9px;background:#fbfcfd;padding:18px;overflow:hidden}.hint{font-size:13px;color:#53626d;margin-top:11px}
.ruler{position:relative;height:72px;margin:30px auto 15px;border-bottom:4px solid #5d6871;max-width:820px}.tick{position:absolute;bottom:-4px;border-left:1px solid #26323a}.tick.major{height:28px;border-left-width:2px}.tick.half{height:21px}.tick.quarter{height:16px}.tick.small{height:11px}.num{position:absolute;bottom:-48px;transform:translateX(-50%);font-size:13px}
.stock{height:80px;background:#d6b36b;border:2px solid #66532f;position:relative;margin:70px auto 15px}.cutmarker{position:absolute;top:-18px;width:28px;height:116px;transform:translateX(-14px);cursor:grab;touch-action:none}.cutmarker:before{content:"";position:absolute;left:13px;top:0;height:116px;border-left:3px solid #bd2026}.cutmarker:after{content:"CUT";position:absolute;top:-22px;left:-1px;font-size:11px;font-weight:bold;color:#9d171c}
.tray{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:16px 0}.part{min-width:72px;padding:12px 8px;border:2px solid #52606b;background:#c3cbd1;border-radius:5px;font-weight:bold;text-align:center;cursor:grab;user-select:none}.part button{min-height:0;padding:2px 6px;margin-left:5px}
.dropzone{min-height:105px;border:3px dashed #8193a2;border-radius:8px;background:#f2f5f7;padding:12px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.dropzone.over{border-color:#1f4e79;background:#eaf3fa}.placed{height:62px;min-width:52px;background:#aeb8c0;border:2px solid #46515a;display:flex;align-items:center;justify-content:center;font-weight:bold;padding:5px;cursor:pointer}
.status{text-align:center;font-weight:bold;margin:12px 0;color:#35434d}.hole{position:absolute;width:25px;height:25px;border:3px solid #bd2026;border-radius:50%;background:#fff;top:25px;transform:translateX(-12px);cursor:grab;touch-action:none}.hole:after{content:"";position:absolute;left:9px;top:9px;width:2px;height:2px;background:#bd2026}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.rail{min-height:90px;border-bottom:6px solid #58656f;display:flex;align-items:flex-end;gap:2px;padding:10px;margin-top:20px}.segment{height:55px;background:#aeb8c0;border:2px solid #46515a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;cursor:pointer}
@media(max-width:600px){.main{padding:10px}#work{padding:10px}.current{width:100%}.part{min-width:62px}}
</style></head><body>
<div class="lab"><header><h1>Fraction Shop Lab</h1><div>Select the job assigned in Canvas. Perform the shop task here, then answer the matching Canvas question.</div></header>
<div class="controls"><label><strong>Assigned Job</strong><br><select id="sel"></select></label><div class="current">CURRENT JOB: <span id="jid"></span></div></div>
<div class="main"><div class="order"><h2 id="title"></h2><div id="prompt"></div></div><div id="work"></div>
<div class="actions"><button id="reset" type="button">Reset Workspace</button></div>
<div class="hint"><strong>The interactive does not give you the answer.</strong> Use it as your shop workspace. Simplify all fractional answers before entering them in Canvas.</div></div></div>
<script>
const jobs=[{"id": "F-001", "type": "cut", "title": "Cut Stock Layout", "prompt": "Lay out three pieces that are each 1 3/8 in. long on the 6 in. stock. Drag each red cut marker to the correct cumulative cut location. Canvas will ask how much stock remains.", "stock": 6, "piece": 1.375, "count": 3}, {"id": "F-002", "type": "shim", "title": "Build a Shim Stack", "prompt": "The required shim stack is 1 5/16 in. Drag shims from the parts tray into the stack area. You may use more than one of the same size. Canvas will ask you to report the stack you built.", "target": 1.3125, "options": [0.5, 0.375, 0.25, 0.125, 0.0625]}, {"id": "F-003", "type": "assembly", "title": "Fill the Assembly Gap", "prompt": "A bracket leaves a 1 1/16 in. gap. Drag spacers into the gap until your stack matches the required clearance. Canvas will ask about the spacer combination.", "target": 1.0625, "options": [0.5, 0.375, 0.25, 0.125, 0.0625]}, {"id": "F-004", "type": "layout", "title": "Hole Layout", "prompt": "Starting 3/8 in. from the left edge, lay out four hole centers spaced 1 1/8 in. apart. Drag the four hole markers to their correct locations. Canvas will ask for the location of the final hole.", "start": 0.375, "spacing": 1.125, "count": 4, "stock": 5}, {"id": "F-005", "type": "measure", "title": "Build to Length", "prompt": "Build an assembly exactly 3 7/16 in. long by dragging available components into the assembly rail. Canvas will ask you to identify the total length or a component relationship.", "target": 3.4375, "options": [1.5, 1.0, 0.75, 0.5, 0.375, 0.25, 0.1875, 0.125, 0.0625]}], sel=document.getElementById('sel'), work=document.getElementById('work');
jobs.forEach(j=>{let o=document.createElement('option');o.value=j.id;o.textContent=j.id+' — '+j.title;sel.append(o)});
const gcd=(a,b)=>b?gcd(b,a%b):a;
function mix(v){let w=Math.floor(v+1e-8),n=Math.round((v-w)*16);if(n===16){w++;n=0}if(!n)return String(w);let g=gcd(n,16);n/=g;let d=16/g;return(w?w+' ':'')+n+'/'+d}
function makeRuler(max){let r=document.createElement('div');r.className='ruler';for(let i=0;i<=max*16;i++){let t=document.createElement('i'),x=i/(max*16)*100;t.className='tick '+(i%16===0?'major':i%8===0?'half':i%4===0?'quarter':'small');t.style.left=x+'%';r.append(t);if(i%16===0){let n=document.createElement('span');n.className='num';n.style.left=x+'%';n.textContent=i/16;r.append(n)}}return r}
function dragHorizontal(el,parent,max,snap=1/16){let active=false;el.addEventListener('pointerdown',e=>{active=true;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;let b=parent.getBoundingClientRect(),v=(e.clientX-b.left)/b.width*max;v=Math.max(0,Math.min(max,Math.round(v/snap)*snap));el.dataset.value=v;el.style.left=(v/max*100)+'%'});el.addEventListener('pointerup',()=>active=false)}
function addPartTray(j,zone){let tray=document.createElement('div');tray.className='tray';j.options.forEach(v=>{let p=document.createElement('div');p.className='part';p.textContent=mix(v)+'"';p.draggable=true;p.dataset.v=v;p.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',v));p.addEventListener('click',()=>place(v,zone));tray.append(p)});work.append(tray)}
function place(v,zone){let p=document.createElement('div');p.className='placed';p.textContent=mix(+v)+'"';p.title='Click to remove';p.addEventListener('click',()=>p.remove());zone.append(p)}
function dropSetup(zone){zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});zone.addEventListener('dragleave',()=>zone.classList.remove('over'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');place(e.dataTransfer.getData('text/plain'),zone)})}
function render(){let j=jobs.find(x=>x.id===sel.value)||jobs[0];jid.textContent=j.id;title.textContent=j.title;prompt.textContent=j.prompt;work.innerHTML='';
 if(j.type==='cut'){let stock=document.createElement('div');stock.className='stock';stock.style.width='82%';for(let i=0;i<j.count;i++){let m=document.createElement('div');m.className='cutmarker';m.style.left=((i+1)/(j.count+1)*100)+'%';dragHorizontal(m,stock,j.stock);stock.append(m)}work.append(stock,makeRuler(j.stock));let s=document.createElement('div');s.className='status';s.textContent='Drag each CUT marker to the correct cumulative cut location.';work.append(s)}
 else if(j.type==='shim'||j.type==='assembly'){let zone=document.createElement('div');zone.className='dropzone';zone.innerHTML='<span>Drag or click parts to place them here. Click a placed part to remove it.</span>';work.append(zone);dropSetup(zone);addPartTray(j,zone);let s=document.createElement('div');s.className='status';s.textContent='Required finished stack: '+mix(j.target)+' in.';work.append(s)}
 else if(j.type==='layout'){let stock=document.createElement('div');stock.className='stock';stock.style.width='82%';for(let i=0;i<j.count;i++){let h=document.createElement('div');h.className='hole';h.style.left=((i+1)/(j.count+1)*100)+'%';dragHorizontal(h,stock,j.stock);stock.append(h)}work.append(stock,makeRuler(j.stock));let s=document.createElement('div');s.className='status';s.textContent='Start = '+mix(j.start)+' in.   •   Spacing = '+mix(j.spacing)+' in.';work.append(s)}
 else if(j.type==='measure'){let zone=document.createElement('div');zone.className='rail';work.append(zone);dropSetup(zone);addPartTray(j,zone);let s=document.createElement('div');s.className='status';s.textContent='Target assembly length: '+mix(j.target)+' in.';work.append(s)}
}
sel.addEventListener('change',render);document.getElementById('reset').addEventListener('click',render);sel.value='F-001';render();
</script></body></html>
