<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Shop Lab</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#26323b}.lab{max-width:950px;margin:18px auto;background:#fff;border:1px solid #bcc8d2;border-radius:10px;overflow:hidden}header{background:#1f4e79;color:#fff;padding:18px}header h1{margin:0 0 6px}.controls,.main{padding:16px 20px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#f7f9fb;border-bottom:1px solid #d6dee5}select,button{font:inherit;padding:9px}#current{font-size:20px;font-weight:bold;color:#1f4e79}.order{background:#eaf3fa;border-left:5px solid #1f4e79;padding:13px;margin-bottom:15px}.order h2{margin:0 0 7px}#work{min-height:310px;border:2px solid #b7c4ce;border-radius:9px;background:#fbfcfd;padding:18px;overflow:hidden}.bar{height:72px;background:#d5b267;border:2px solid #67542e;position:relative;margin:80px auto 25px}.cut{position:absolute;top:-10px;height:90px;border-left:2px dashed #a12626}.shims{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin-top:55px;flex-wrap:wrap}.shim{width:85px;background:#b6bec5;border:2px solid #46515a;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}.shim.on{outline:4px solid #1f4e79}.gap{height:75px;border:3px solid #46515a;margin:80px auto 20px;position:relative}.used{height:100%;background:#b7c0c7;border-right:3px solid #46515a}.line{height:8px;background:#65717b;margin:120px auto 55px;position:relative}.mark{position:absolute;top:-25px;height:58px;border-left:3px solid #1f4e79}.plate{margin:55px auto;background:#adb7bf;border:2px solid #46515a;display:flex;align-items:center;justify-content:center;font-weight:bold}.note{margin-top:12px;font-size:13px;color:#56636d}</style></head><body>
<div class="lab"><header><h1>Fraction Shop Lab</h1><div>Select the job assigned in Canvas. Use the workspace to solve it; record the answer in Canvas.</div></header>
<div class="controls"><label><strong>Assigned Job</strong><br><select id="sel"></select></label><div id="current"></div></div>
<div class="main"><div class="order"><h2 id="title"></h2><div id="prompt"></div></div><div id="work"></div><button id="reset" type="button">Reset Workspace</button><div class="note"><strong>No answer is shown here.</strong> Simplify fractional answers before entering them in Canvas.</div></div></div>
<script>
const jobs=[{"id": "F-001", "type": "cut", "title": "Cut Stock", "prompt": "You have a 6 in. strip of stock. Three pieces, each 1 3/8 in. long, must be cut from it. Use the workspace to model the cuts. How much stock remains?", "a": 6, "b": 1.375, "n": 3}, {"id": "F-002", "type": "shim", "title": "Shim Stack", "prompt": "Build a shim stack totaling 1 1/8 in. using the available shims. Determine the total thickness of the selected stack.", "target": 1.125, "opts": [0.5, 0.375, 0.25, 0.125, 0.0625]}, {"id": "F-003", "type": "gap", "title": "Assembly Gap", "prompt": "The available space is 4 1/2 in. An installed component occupies 2 13/16 in. Determine the remaining gap.", "a": 4.5, "b": 2.8125}, {"id": "F-004", "type": "layout", "title": "Repeated Layout", "prompt": "Four mounting intervals are spaced 7/8 in. apart. Starting at zero, determine the location after the fourth interval.", "a": 0.875, "n": 4}, {"id": "F-005", "type": "area", "title": "Plate Area", "prompt": "A rectangular access plate is 3 3/4 in. long and 2 1/2 in. wide. Determine its area.", "a": 3.75, "b": 2.5}],sel=document.querySelector('#sel'),work=document.querySelector('#work');
jobs.forEach(j=>{let o=document.createElement('option');o.value=j.id;o.textContent=j.id+' — '+j.title;sel.append(o)});
function mix(v){let q=Math.floor(v+1e-8),n=Math.round((v-q)*16);if(n===16){q++;n=0}if(!n)return ''+q;let g=(a,b)=>b?g(b,a%b):a,d=16,x=g(n,d);n/=x;d/=x;return(q?q+' ':'')+n+'/'+d}
function render(){let j=jobs.find(x=>x.id===sel.value)||jobs[0];current.textContent='CURRENT JOB: '+j.id;title.textContent=j.title;prompt.textContent=j.prompt;work.innerHTML='';
if(j.type==='cut'){let b=document.createElement('div');b.className='bar';b.style.width=Math.min(720,work.clientWidth-50)+'px';for(let i=1;i<=j.n;i++){let m=document.createElement('i');m.className='cut';m.style.left=(i*j.b/j.a*100)+'%';b.append(m)}work.append(b)}
if(j.type==='shim'){let d=document.createElement('div');d.className='shims';j.opts.forEach(v=>{let s=document.createElement('div');s.className='shim';s.style.height=(45+v*100)+'px';s.textContent=mix(v)+'"';s.tabIndex=0;let t=()=>s.classList.toggle('on');s.onclick=t;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}};d.append(s)});work.append(d)}
if(j.type==='gap'){let d=document.createElement('div');d.className='gap';d.style.width=Math.min(720,work.clientWidth-50)+'px';let u=document.createElement('div');u.className='used';u.style.width=(j.b/j.a*100)+'%';d.append(u);work.append(d)}
if(j.type==='layout'){let d=document.createElement('div');d.className='line';d.style.width=Math.min(720,work.clientWidth-50)+'px';for(let i=0;i<=j.n;i++){let m=document.createElement('i');m.className='mark';m.style.left=(i/j.n*100)+'%';d.append(m)}work.append(d)}
if(j.type==='area'){let d=document.createElement('div');d.className='plate';d.style.width=(j.a*65)+'px';d.style.height=(j.b*65)+'px';d.textContent=mix(j.a)+' in × '+mix(j.b)+' in';work.append(d)}}
sel.onchange=render;reset.onclick=render;sel.value='F-001';render();
</script></body></html>
