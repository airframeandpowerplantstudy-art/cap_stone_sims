function scanner(){return `<div class=controls><button id=scan>⚡ SCAN SELECTED PART</button></div><div class=scanner id=scanner><div class=beam></div><b>LASER SCANNER DIMENSION SCANNER</b><div class=readout id=readout>SELECT A PART TO SCAN</div></div>`}
function rack(parts){return `<h2 style="text-align:center;color:#1f4e79">PARTS RACK</h2><div class=rack id=rack>${parts.map((p,i)=>`<div class=part data-i=${i}>${p.pn}<div class=dim>DIMENSION UNKNOWN</div></div>`).join('')}</div>`}

function sheet(j,title,info,task,ask){$('sheet').innerHTML=`<h2>${j.id} — ${title}</h2><div class=order><b>WORK ORDER</b><br>${info}</div><div class=ask><h3>Shop task</h3><p>${task}</p><h3>Return to Canvas</h3><p>${ask}</p></div><p class=hint>LASER SCANNER reports dimensions only. It does not perform the decimal arithmetic.</p>`}
function add(j,mixed=false){$('shop').innerHTML=`<div class=station><h2>ASSEMBLY STATION</h2><div class=tray id=tray></div>${rack(j.parts)}${scanner()}<div class=controls><button id=install>Install Selected Component</button><button id=clear>Clear Assembly</button></div></div>`;wire(j);$('install').onclick=()=>{if(!selected)return;let d=document.createElement('div');d.className='installed';d.textContent=selected.p.pn;d.onclick=()=>d.remove();$('tray').append(d)};$('clear').onclick=()=>$('tray').innerHTML='';sheet(j,mixed?'SHOP CHALLENGE':'ASSEMBLY BUILD','Assembly requires components: <b>'+j.required.join(', ')+'</b>.','Locate the specified components, scan them to obtain their dimensions, and assemble them in the tray.','Enter the overall length of the completed assembly.')}
